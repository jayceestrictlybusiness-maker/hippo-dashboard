let currentView = "renewals";
function activeView() { return VIEWS[currentView]; }

function stageLabel(id) {
  const st = activeView().statusStages.find(x => x.id === id);
  return st ? st.label : id;
}

/* The two filters that exist in more than one place: once in the left panel and
   again as a column header in the table. Everything that differs between them —
   where the value lives, which element mirrors it, how to count and label the
   options — is stated once here, so the panel and the header can never drift
   into offering different lists or different counts.

   Counting PEOPLE (pass holder plus dependants) rather than families is what
   makes the bracketed numbers match the breakdown list. */
const COLUMN_FILTERS = {
  dept: {
    elId:     "deptFilter",
    allLabel: "All departments",
    get:      () => deptFilter,
    set:      (v) => { deptFilter = v; },
    counts:   () => countPeopleBy((m, fam) => m.dept || fam.dept),
    known:    () => DEPT_LIST,
    labelFor: (k) => k,
  },
  status: {
    elId:     "statusFilter",
    allLabel: "All statuses",
    get:      () => statusFilter,
    set:      (v) => { statusFilter = v; },
    counts:   () => countPeopleBy(activeView().statusOf),
    known:    () => activeView().statusStages.map(st => st.id),
    labelFor: stageLabel,
  },
};

// The <option> list for a filter, shared by the panel select and the header one.
function filterOptions(f, selected) {
  const counts = f.counts();
  return orderedKeys(counts, f.known()).map(k =>
    '<option value="' + esc(k) + '"' + (k === selected ? " selected" : "") + ">" +
    esc(f.labelFor(k)) + " (" + counts.get(k) + ")</option>").join("");
}

function countPeopleBy(pick, visibleOnly) {
  const counts = new Map();
  families.forEach(fam => {
    if (visibleOnly && !matchesFilters(fam)) return;
    familyMembers(fam).forEach(m => {
      const key = (pick(m, fam) || "").trim();
      if (key) counts.set(key, (counts.get(key) || 0) + 1);
    });
  });
  return counts;
}

// Known values first, then anything unexpected from real PA data, so a value we
// have not seen before can never silently vanish from a filter.
function orderedKeys(counts, known) {
  const out = known.filter(k => counts.has(k));
  counts.forEach((_, k) => { if (out.indexOf(k) < 0) out.push(k); });
  return out;
}

function fillCountedSelect(name) {
  const f = COLUMN_FILTERS[name];
  document.getElementById(f.elId).innerHTML =
    '<option value="all">' + esc(f.allLabel) + '</option>' + filterOptions(f, null);
}

function populateFilters() {
  const view = activeView();
  // The whole labelled field is hidden, not just the <select> — hiding the
  // control alone would leave a stranded "Department" caption behind.
  document.getElementById("deptField").style.display = view.showDeptFilter ? "" : "none";
  if (view.showDeptFilter) {
    fillCountedSelect("dept");
  } else {
    document.getElementById("deptFilter").innerHTML = '<option value="all">All</option>';
  }
  document.getElementById("statusField").querySelector(".fld-label").textContent = view.statusLabel;
  fillCountedSelect("status");
}

function renderBreakdown() {
  // Same single-pass tally the filter dropdowns use, narrowed to what is
  // currently visible. It used to be a second copy of that loop.
  const view = activeView();
  const counts = countPeopleBy(view.statusOf, true);
  const body = document.getElementById("breakdownBody");
  body.innerHTML = view.statusStages.map(s => {
    const count = counts.get(s.id) || 0;
    return `<div class="bd-row"><span class="bd-label">${s.label}</span><span class="bd-count">${count} ${count === 1 ? 'person' : 'people'}</span></div>`;
  }).join("");
}

/* ============================================================
   INTERACTIONS
   ============================================================ */
// Click on canvas
// Scene coordinates from a pointer event. getBoundingClientRect already
// reflects the zoom/pan transform, so this stays correct at any view.
function sceneCoords(e) {
  const rect = canvas.getBoundingClientRect();
  return [(e.clientX - rect.left) / rect.width, (e.clientY - rect.top) / rect.height];
}

// Shared by the click and hover handlers, so the two hit boxes cannot drift.
function hippoAt(nxv, nyv) {
  for (const h of hippos) {
    if (h.dimmed) continue;
    const dx = Math.abs(h.x - nxv) * W;
    const dy = (h.y - nyv) * H;
    if (dx < 22 && dy > -4 && dy < 38) return h;
  }
  return null;
}

function showTooltip(e, text) {
  const tt = document.getElementById("tooltip");
  tt.textContent = text;
  tt.style.left = (e.clientX + 12) + "px";
  tt.style.top  = (e.clientY - 8) + "px";
  tt.classList.add("show");
  canvas.style.cursor = "pointer";
}
function hideTooltip() {
  document.getElementById("tooltip").classList.remove("show");
  canvas.style.cursor = "default";
}

canvas.addEventListener("click", (e) => {
  // A pan gesture ends in a click event; do not treat that as a selection.
  if (suppressClick) { suppressClick = false; return; }
  dismissHint();
  const [x, y] = sceneCoords(e);

  const hit = hippoAt(x, y);
  // Straight from the beach: nothing underneath, so no Back button.
  if (hit) { modalStack = []; openPanel(() => openHippoCard(hit.family)); return; }

  const key = pondAt(x, y);
  modalStack = [];
  if (key === "main") openPanel(openFullTable);
  else if (key) openPanel(() => openPondList(key));
});

// Hover tooltip
canvas.addEventListener("mousemove", (e) => {
  const [x, y] = sceneCoords(e);
  const hit = hippoAt(x, y);
  if (hit) {
    showTooltip(e, activeView().hippoTooltip(hit.family));
    return;
  }
  const key = pondAt(x, y);
  if (key) { showTooltip(e, pondMeta(key).label); return; }
  hideTooltip();
});

canvas.addEventListener("mouseleave", hideTooltip);

/* ============================================================
   MODALS
   ============================================================ */
// The detail panel is a right-hand drawer so the scene stays visible while
// reading. A scrim is only used on narrow screens, where it overlaps anyway.
/* Every panel shares the same header and the pond/results lists share the same
   row, so they are built in one place rather than copied four times. */
function avatarEmoji(ch) {
  return '<div class="modal-portrait" style="font-size:1.7rem;">' + ch + '</div>';
}
/* Panel navigation. A card is reachable from the table, a pond list, the results
   list and the canvas, and only the first three have anywhere to go back TO —
   hence a stack of render thunks rather than a single "previous" flag. The top
   of the stack is whatever is on screen, so re-running it (a sort, a filter
   change) re-renders in place without growing the stack. */
let modalStack = [];

function openPanel(renderFn) {
  modalStack.push(renderFn);
  renderFn();
}
// Re-render what is already on screen, e.g. after a sort or a filter change.
function refreshPanel() {
  const top = modalStack[modalStack.length - 1];
  if (top) top();
}
function panelBack() {
  modalStack.pop();
  const prev = modalStack[modalStack.length - 1];
  if (prev) prev(); else closeModal();
}
window.panelBack = panelBack;

function modalHead(avatar, title, subHtml) {
  // Shown only when there is a panel underneath to return to. Filters and sort
  // are global state, so going back lands on the list exactly as it was left.
  const back = modalStack.length > 1
    ? '<button class="back-btn" onclick="panelBack()">← Back</button>' : "";
  /* Stacked under the portrait rather than beside it. As a sibling of the
     avatar it ate width from .modal-title, and long names — which real HR data
     is full of — wrapped onto three lines to pay for it. The avatar column is
     already a fixed 64px, so a button underneath costs the title nothing. */
  return `
    <div class="modal-head">
      <div class="modal-avatar-col">
        ${avatar}
        ${back}
      </div>
      <div class="modal-title">
        <h2>${esc(title)}</h2>
        <div class="sub">${subHtml}</div>
      </div>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>`;
}
function plural(nn, one, many) { return nn + " " + (nn === 1 ? one : many); }

function familyRow(fam, extraClass) {
  return `
    <div class="pond-list-item ${extraClass || ""}" onclick="openCardFrom(${families.indexOf(fam)})">
      <div class="mini-portrait"><img src="${dataURL('PORTRAIT_EP')}" alt="EE"></div>
      <div class="family-info">${activeView().familyRowDetail(fam)}</div>
    </div>`;
}

// Renewals row: department, pass + status, and a red call-out naming whichever
// family member is closest to expiry.
function renewalFamilyRowDetail(fam) {
  const members = [Object.assign({}, fam, { isEP: true })].concat(fam.dps);
  const worst = members.reduce((m, x) => x.daysLeft < m.daysLeft ? x : m);
  return `
    <div class="family-name">${esc(fam.name)} · <span style="color:var(--ink-soft); font-weight:400;">${esc(fam.dept)}</span></div>
    <div class="family-detail">${esc(fam.passType)} · ${esc(fam.status)}</div>
    <div class="family-detail" style="margin-top:4px; color:#8b2a1a; font-weight:600;">
      ⚠ ${esc(worst.name)}${worst.isEP ? " (EE)" : " (DP)"} — ${daysLabel(worst.daysLeft)}
    </div>`;
}

// Applications row: nationality, pass + Column K, and the dependant count.
// No urgency call-out, because there is no urgency to call out.
function applicationFamilyRowDetail(fam) {
  const n = fam.dps.length;
  // Mirrors the Renewals row's "⚠ worst member" line, but only when the family
  // straddles stages — otherwise the pond label already says it.
  const drv = (fam.spansStages && fam.stageDriver) ? `
    <div class="family-detail" style="margin-top:4px; color:#4a5c66; font-weight:600;">
      ⚠ ${esc(fam.stageDriver.name)}${fam.stageDriverIsEP ? " (EE)" : " (DP)"} — ${esc(fam.stageDriver.kStatus)}
    </div>` : "";
  return `
    <div class="family-name">${esc(fam.name)} · <span style="color:var(--ink-soft); font-weight:400;">${esc(fam.nationality)}</span></div>
    <div class="family-detail">${esc(fam.workPass)} · ${esc(fam.kStatus)}</div>
    <div class="family-detail" style="margin-top:4px;">${esc(fam.email)}${
      n ? ` · ${n} dependant${n === 1 ? "" : "s"}` : ""}</div>${drv}`;
}

function openModal(html, wide = false, hasTable = false) {
  const drawer = document.getElementById("drawer");
  const modal = document.getElementById("modal");
  modal.innerHTML = html;
  modal.classList.toggle("has-table", hasTable);
  drawer.classList.toggle("wide", wide);
  drawer.classList.add("open");
  document.getElementById("scrim").classList.add("open");
  dismissHint();
}
function closeModal() {
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("scrim").classList.remove("open");
  modalStack = [];
}
window.closeModal = closeModal;
document.getElementById("scrim").addEventListener("click", closeModal);

/* Transient bottom-centre message. Also the hook for the future PA refresh. */
function toast(msg, ms = 2600) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.getElementById("toastWrap").appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => el.remove(), 250);
  }, ms);
}
window.toast = toast;

/* First-visit hint. localStorage can throw in restricted contexts. */
const HINT_KEY = "hippo.hintSeen";
function showHintIfFirstVisit() {
  let seen = false;
  try { seen = localStorage.getItem(HINT_KEY) === "1"; } catch (e) {}
  if (!seen) document.getElementById("hint").hidden = false;
}
function dismissHint() {
  const el = document.getElementById("hint");
  if (!el || el.hidden) return;
  el.classList.add("hide");
  setTimeout(() => { el.hidden = true; }, 320);
  try { localStorage.setItem(HINT_KEY, "1"); } catch (e) {}
}

const FILTER_FIELDS = ["search", "deptFilter", "statusFilter"];
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeModal(); return; }
  // Enter from any filter field shows the matches in the drawer.
  if (e.key === "Enter") {
    const id = (document.activeElement && document.activeElement.id) || "";
    if (FILTER_FIELDS.indexOf(id) >= 0) {
      e.preventDefault(); modalStack = []; openPanel(openFilterResults); return;
    }
  }
  // "/" focuses search, unless the user is already typing somewhere.
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if (e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) {
    e.preventDefault();
    document.getElementById("search").focus();
  }
});

document.getElementById("activeFilters").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-clear]");
  if (!btn) return;
  if (btn.dataset.clear === "dept") {
    deptFilter = "all";
    document.getElementById("deptFilter").value = "all";
  } else if (btn.dataset.clear === "status") {
    statusFilter = "all";
    document.getElementById("statusFilter").value = "all";
  } else {
    searchTerm = "";
    document.getElementById("search").value = "";
  }
  applyFilterChange();
});

function openHippoCard(fam) {
  openModal(activeView().cardRender(fam));
}

function renderRenewalCard(fam) {
  const hasUrgentFamily = familyMembers(fam)
    .some(m => urgencyBand(m.daysLeft) !== "safe");
  const portraitURL = dataURL("PORTRAIT_EP");

  let html = `
    ${modalHead(`<div class="modal-portrait"><img src="${portraitURL}" alt="EE portrait"></div>`,
      fam.name,
      esc(fam.passType) + " · Workday ID " + esc(fam.workdayId) + " · " + esc(fam.dept))}
    <div class="modal-body">`;

  if (fam.status === "Renewal Voided") {
    html += `<div class="action-needed">⚠️ Renewal voided — review case</div>`;
  } else if (hasUrgentFamily) {
    html += `<div class="action-needed">⚠️ Action needed — family member(s) in urgency window</div>`;
  }

  html += `
    <div class="card-stats">
      <div class="card-stat ${urgencyBand(fam.daysLeft)}">
        <div class="lbl">Expiry</div>
        <div class="val">${formatDate(fam.expiryDate)}</div>
      </div>
      <div class="card-stat ${urgencyBand(fam.daysLeft)}">
        <div class="lbl">Days Left</div>
        <div class="val">${daysLabel(fam.daysLeft)}</div>
      </div>
    </div>
    <div class="card-status"><strong>Status:</strong> ${esc(fam.status)}</div>`;

  // Conditional, unlike the Status line above: a blank Remarks cell is the
  // normal case, and an empty "Remarks:" label on every card would be noise.
  if ((fam.remarks || "").trim()) {
    html += `<div class="card-remarks"><strong>Remarks:</strong> ${esc(fam.remarks)}</div>`;
  }

  if (fam.dps.length > 0) {
    html += `<div class="family-section"><h4>Family (${fam.dps.length} dependent${fam.dps.length !== 1 ? 's' : ''})</h4>`;
    fam.dps.forEach(d => {
      const dBand = urgencyBand(d.daysLeft);
      const isUrgent = dBand !== "safe";
      const dpURL = dataURL("PORTRAIT_DP");
      html += `
        <div class="family-member ${isUrgent ? 'urgent-ref' : ''}">
          <div class="mini-portrait"><img src="${dpURL}" alt="DP portrait"></div>
          <div class="family-info">
            <div class="family-name">${esc(d.name)}</div>
            <div class="family-detail">${esc(d.passType)} · ${formatDate(d.expiryDate)} · ${daysLabel(d.daysLeft)}</div>
            <div class="family-detail" style="margin-top:3px;">${esc(d.status)}</div>
            ${(d.remarks || "").trim() ? `<div class="family-remark">${esc(d.remarks)}</div>` : ""}
          </div>
        </div>`;
    });
    html += `</div>`;
  } else {
    html += `<div style="color:#8b6338; font-size:0.85rem; font-style:italic; margin-top:0.5rem;">No dependents.</div>`;
  }

  html += `</div>`;
  return html;
}

/* "Completed" / "Voided" — the short form of the two excluded Column K values,
   for the pill beside a finished member's name. */
function completedBadge(kStatus) {
  if (!APPLICATION_COMPLETED_K.has(kStatus)) return "";
  const word = kStatus.indexOf("Voided") >= 0 ? "Voided" : "Completed";
  return `<span class="member-badge">${word}</span>`;
}

/* The marker on whichever member put the family in its pond. Suppressed unless
   the family actually straddles stages: if everyone is at the same point there
   is no "earliest" worth pointing at, only noise on every card. */
function stageFlag(fam, isDriver) {
  return (fam.spansStages && isDriver) ? '<span class="stage-flag">⚠ earliest stage</span>' : "";
}

/* Applications card. Deliberately carries no Expiry, Days Left, Department or
   Workday ID — none of those exist on the Applications tab, and an empty
   "Days Left: 0" would read as an expired pass rather than a missing column.
   Column M notes go through .card-remarks, which is pre-wrap, because they are
   typed as dated multi-line logs in Excel. */
function renderApplicationCard(fam) {
  const portraitURL = dataURL("PORTRAIT_EP");

  let html = `
    ${modalHead(`<div class="modal-portrait"><img src="${portraitURL}" alt="Candidate portrait"></div>`,
      fam.name,
      esc(fam.workPass) + (fam.nationality ? " · " + esc(fam.nationality) : "") +
      (fam.fin ? " · " + esc(fam.fin) : ""))}
    <div class="modal-body">`;

  /* A finished pass holder normally leaves the scene. When it has not, it is
     because dependants are still in flight — say so, or the card reads as a bug
     ("why is a completed application sitting in Pass Not Applied?"). */
  if (fam.epIsComplete) {
    html += `<div class="card-note-banner">This application is ${
      fam.kStatus.indexOf("Voided") >= 0 ? "voided" : "complete"
    } — still shown because dependant applications are in progress.</div>`;
  }

  html += `
    <div class="card-stats">
      <div class="card-stat">
        <div class="lbl">Request received</div>
        <div class="val">${formatDate(fam.requestReceived)}</div>
      </div>
      <div class="card-stat">
        <div class="lbl">Application date</div>
        <div class="val">${formatDate(fam.applicationDate)}</div>
      </div>
    </div>
    <div class="card-status"><strong>Status:</strong> ${esc(fam.kStatus)}${
      completedBadge(fam.kStatus)}${stageFlag(fam, fam.stageDriverIsEP)}</div>
    <div class="card-meta-line">${esc(fam.email)}${
      fam.recruiter ? " · recruiter " + esc(fam.recruiter) : ""}</div>`;

  if ((fam.notes || "").trim()) {
    html += `<div class="card-remarks"><strong>Status notes:</strong> ${esc(fam.notes)}</div>`;
  }

  if (fam.dps.length > 0) {
    html += `<div class="family-section"><h4>Family (${fam.dps.length} dependant${fam.dps.length !== 1 ? 's' : ''})</h4>`;
    fam.dps.forEach(d => {
      const dpURL = dataURL("PORTRAIT_DP");
      // Finished dependants still render — the card is the full picture of the
      // household, and hiding one would make the family count disagree with it.
      const done = APPLICATION_COMPLETED_K.has(d.kStatus);
      const isDriver = d === fam.stageDriver;
      const cls = done ? " is-done" : (fam.spansStages && isDriver ? " stage-ref" : "");
      html += `
        <div class="family-member${cls}">
          <div class="mini-portrait"><img src="${dpURL}" alt="Dependant portrait"></div>
          <div class="family-info">
            <div class="family-name">${esc(d.name)}${completedBadge(d.kStatus)}${
              stageFlag(fam, isDriver)}</div>
            <div class="family-detail">${esc(d.workPass)}${d.email ? " · " + esc(d.email) : ""}</div>
            <div class="family-detail" style="margin-top:3px;">${esc(d.kStatus)}</div>
            ${(d.notes || "").trim() ? `<div class="family-remark">${esc(d.notes)}</div>` : ""}
          </div>
        </div>`;
    });
    html += `</div>`;
  } else {
    html += `<div style="color:#8b6338; font-size:0.85rem; font-style:italic; margin-top:0.5rem;">No dependants.</div>`;
  }

  html += `</div>`;
  return html;
}

/* Every list panel is the same three parts: a head, either the rows or a note
   saying there are none, and the body wrapper around them. Keeping the shape in
   one place is mostly about the empty case, which is the part a new list is
   likely to forget. */
function openListPanel(head, rows, emptyNote, emptyColour) {
  openModal(head + '<div class="modal-body">' +
    (rows.length ? rows.join("")
      : `<p style="color:${emptyColour}; font-style:italic; text-align:center; padding:2rem;">${emptyNote}</p>`) +
    "</div>");
}

function openPondList(pondKey) {
  const inPond = families.filter(f => f.pondKey === pondKey && matchesFilters(f));
  openListPanel(
    modalHead(avatarEmoji("🌊"), pondMeta(pondKey).label,
      plural(inPond.length, "family", "families") + " in this pond"),
    // The red left-edge marker is an urgency cue, so Renewals only.
    inPond.map(ff => familyRow(ff, currentView === "renewals" ? "has-urgent" : "")),
    "No matches in this pond with current filters.", "#8b6338");
}

/* Exposed for the inline onclick handlers in the generated rows, which index
   into it. Reassigned by rebuildAll() — a stale FAMILIES would open the wrong
   person's card after a view switch, silently and with real HR data. */
window.openHippoCard = openHippoCard;
/* Rows in the table and the lists go THROUGH the stack, so the card they open
   carries a Back button to the list they came from. */
window.openCardFrom = (i) => openPanel(() => openHippoCard(FAMILIES[i]));

let tableSortKey = "daysLeft", tableSortAsc = true;

function tableComparator(a, b) {
  const k = tableSortKey;
  let va = a[k], vb = b[k];
  if (typeof va === "boolean") { va = va ? 1 : 0; vb = vb ? 1 : 0; }
  let r;
  if (typeof va === "number" && typeof vb === "number") r = va - vb;
  else r = String(va == null ? "" : va).localeCompare(String(vb == null ? "" : vb));
  // Stable tiebreak: by expiry in Renewals, by name in Applications (which has
  // no daysLeft at all, so the old subtraction would have yielded NaN).
  if (r === 0) {
    if (currentView === "renewals" && k !== "daysLeft") r = a.daysLeft - b.daysLeft;
    else if (currentView !== "renewals" && k !== "name") {
      r = String(a.name || "").localeCompare(String(b.name || ""));
    }
  }
  return tableSortAsc ? r : -r;
}

/* One cell renderer per view, so the table never has to guess which columns it
   is drawing. Both are given the flattened row (a family or one of its
   dependants) plus the column key. */
/* A table cell is: a per-view override for the columns that need one, the
   shared Type cell both views draw identically, and otherwise the plain escaped
   value. Spelling that chain out twice is how the two renderers ended up with
   the same Type cell copied into both — and how one of them could have been
   missed when EP became EE. */
const SHARED_CELLS = {
  _isEP: (r) => `<td><span class="type-icon ${r._isEP ? 'ep' : 'dp'}"></span>${r._isEP ? 'EE' : 'DP'}</td>`,
};
// Small text, for the long free-text columns.
const smallCell = (v) => `<td style="font-size:0.78rem;">${esc(v)}</td>`;

const RENEWAL_CELLS = {
  expiryDate: (r) => `<td>${formatDate(r.expiryDate)}</td>`,
  daysLeft: (r) => {
    const band = urgencyBand(r.daysLeft);
    const colour = band === 'crit' ? 'var(--crit)' : band === 'warn' ? 'var(--warn)' : 'var(--safe)';
    return `<td style="text-align:right; color:${colour}; font-weight:700;">${r.daysLeft}</td>`;
  },
  status: (r) => smallCell(r.status),
};
const APPLICATION_CELLS = {
  applicationDate: (r) => `<td>${formatDate(r.applicationDate)}</td>`,
  kStatus: (r) => smallCell(r.kStatus),
  email:   (r) => smallCell(r.email),
};

function tableCellFrom(r, key, cells) {
  const render = cells[key] || SHARED_CELLS[key];
  return render ? render(r) : `<td>${esc(r[key] == null ? "" : r[key])}</td>`;
}
// Declarations, not consts: VIEWS names them before these lines are reached.
function renewalTableCell(r, key)     { return tableCellFrom(r, key, RENEWAL_CELLS); }
function applicationTableCell(r, key) { return tableCellFrom(r, key, APPLICATION_CELLS); }

window.sortTable = (key) => {
  if (tableSortKey === key) tableSortAsc = !tableSortAsc;
  else { tableSortKey = key; tableSortAsc = true; }
  refreshPanel();          // re-render in place; do NOT push another panel
};

/* A column dropdown IS the global filter of that name. Setting it here re-filters
   the beach behind the drawer and moves the left-hand panel to match, so the two
   can never show different things. */
window.setColFilter = (which, value) => {
  const f = COLUMN_FILTERS[which];
  f.set(value);
  const el = document.getElementById(f.elId);   // keep the left panel in step
  if (el) el.value = value;
  applyFilterChange();     // scene, footer, breakdown, pills
  refreshPanel();          // and the table under the cursor
};

function filterSummary() {
  const bits = [];
  if (deptFilter !== "all" && activeView().showDeptFilter) bits.push("Dept: " + deptFilter);
  if (statusFilter !== "all") bits.push("Status: " + stageLabel(statusFilter));
  if (searchTerm.trim())      bits.push('"' + searchTerm.trim() + '"');
  return bits.length ? bits.join(" · ") : "No filters — everyone";
}

function openFilterResults() {
  const hits = families.filter(matchesFilters);
  openListPanel(
    modalHead(avatarEmoji("🔍"), "Results",
      esc(filterSummary()) + " · " + plural(hits.length, "family", "families") +
      " · " + plural(peopleCount(hits), "person", "people")),
    hits.map(ff => familyRow(ff)),
    "Nothing matches these filters.", "var(--ink-soft)");
}

function openHowTo() {
  openModal(`
    ${modalHead(avatarEmoji("🧭"), "How to use", "Reading the pond")}
    <div class="modal-body howto">
      ${activeView().howToIntro}
      <p style="color:var(--ink-soft);">Click the 🦛 in the top-left to switch between
      the <b>Renewal</b> and <b>Application</b> pipelines.</p>
      <h4>Getting around</h4>
      <ul>
        <li><b>Scroll</b> to zoom, <b>drag</b> to pan once zoomed in.</li>
        <li><b>Fit</b> snaps back to 100%.</li>
        <li>Names appear above the hippos past 150% zoom.</li>
      </ul>
      <h4>Finding people</h4>
      <ul>
        <li>Click a <b>pond</b> for everyone in it, or a <b>hippo</b> for their card.</li>
        <li>Filter on the left — the fields combine.</li>
        <li>Press <b>Enter</b> or <b>Show results</b> to list the matches here.</li>
        <li><b>/</b> jumps to search · <b>Esc</b> closes this panel.</li>
      </ul>
    </div>`);
}

/* One header cell: a sortable label, plus — for a column carrying `filterKey` —
   a dropdown onto that global filter. The sort handler sits on the label rather
   than the <th> so that opening the dropdown does not also re-sort the table.
   Options and counts come from the same helpers the left-hand panel uses, so the
   two lists always agree. */
/* A filterable column's header IS the dropdown — there is no separate label and
   no sorting on it. Alphabetising a department or a pipeline stage sorts by
   spelling, which carries no meaning; choosing one is what people actually want
   to do with those columns, so the whole header is given over to that. The
   "all" option doubles as the column name, which is why it reads "Dept · All"
   rather than "All departments". */
function tableHeaderCell(c) {
  if (c.filterKey) {
    const f = COLUMN_FILTERS[c.filterKey];
    const current = f.get();
    return '<th class="th-filter">' +
      '<select class="col-filter' + (current !== "all" ? " active" : "") +
      '" onchange="setColFilter(\'' + c.filterKey + '\', this.value)">' +
      '<option value="all">' + esc(c.label) + " · All</option>" +
      filterOptions(f, current) + "</select></th>";
  }
  const sorted = tableSortKey === c.key;
  const arrow = sorted ? (tableSortAsc ? "▲" : "▼") : "↕";
  return '<th class="' + (sorted ? "sorted" : "") + '"' +
    (c.right ? ' style="text-align:right;"' : "") + '>' +
    '<span class="th-label" onclick="sortTable(\'' + c.key + '\')">' +
    esc(c.label) + ' <span class="arrow">' + arrow + "</span></span></th>";
}

function openFullTable() {
  const visible = families.filter(matchesFilters);
  let html = `
    ${modalHead(avatarEmoji("🦛"), "All People",
      plural(visible.length, "family", "families") + " · " +
      peopleCount(visible) + " people")}
    <div class="modal-body" style="padding:0;">
      <table>
        <thead><tr>${activeView().tableCols.map(tableHeaderCell).join("")}</tr></thead>
        <tbody>`;
  // Flattened rather than a nested push loop: one row per person, holder first.
  const allRows = visible.flatMap(f =>
    [{ ...f, _isEP: true, _fam: f }].concat(
      f.dps.map(d => ({ ...d, _isEP: false, _fam: f }))));
  allRows.sort(tableComparator);
  const cols = activeView().tableCols;
  const cell = activeView().tableCell;
  html += allRows.map(r => `
    <tr onclick="openCardFrom(${families.indexOf(r._fam)})">
      ${cols.map(c => cell(r, c.key)).join("")}
    </tr>`).join("");
  html += `</tbody></table></div>`;
  openModal(html, true, true);
}

/* ============================================================
   TOP BAR WIRING
   ============================================================ */
document.getElementById("search").addEventListener("input", (e) => {
  searchTerm = e.target.value;
  applyFilterChange();
});
document.getElementById("deptFilter").addEventListener("change", (e) => {
  deptFilter = e.target.value;
  applyFilterChange();
});
document.getElementById("statusFilter").addEventListener("change", (e) => {
  statusFilter = e.target.value;
  applyFilterChange();
});
document.getElementById("applyFilters").addEventListener("click",
  () => { modalStack = []; openPanel(openFilterResults); });
document.getElementById("clearFilters").addEventListener("click", () => {
  searchTerm = ""; deptFilter = "all"; statusFilter = "all";
  document.getElementById("search").value = "";
  document.getElementById("deptFilter").value = "all";
  document.getElementById("statusFilter").value = "all";
  applyFilterChange(); closeModal();
});
document.getElementById("howToBtn").addEventListener("click",
  () => { modalStack = []; openPanel(openHowTo); });

const FILTERS_KEY = "hippo.filtersOpen";
function setFiltersOpen(open) {
  document.getElementById("filterCol").classList.toggle("collapsed", !open);
  document.getElementById("filterToggle").classList.toggle("active", open);
  try { localStorage.setItem(FILTERS_KEY, open ? "1" : "0"); } catch (e) {}
}
document.getElementById("filterToggle").addEventListener("click", () => {
  setFiltersOpen(document.getElementById("filterCol").classList.contains("collapsed"));
});
document.getElementById("migrateBtn").addEventListener("click", () => {
  // Re-cluster at main pond then trigger walk out
  clusterAtLagoon(0.08, 0.06);
  hippos.forEach(h => { h.waitTicks = Math.floor(Math.random() * 30); });
  toast("Replaying migration…");
});

/* THE TOGGLE. Selector rather than the id so it matches the handoff spec and
   survives the button being moved inside .brand. */
document.querySelector(".brand .emoji").addEventListener("click", () => {
  currentView = (currentView === "renewals") ? "applications" : "renewals";
  rebuildAll();
  toast(activeView().title);
});

/* ============================================================
   MAP-STYLE ZOOM + PAN
   The scene is translated then scaled from its top-left corner.
   Pan is clamped so the artwork can never be dragged off the stage.
   Hit-testing is unaffected: getBoundingClientRect() already reports
   the transformed box, so the normalized coords stay correct.
   ============================================================ */
const MIN_ZOOM = 1, MAX_ZOOM = 4;
let zoom = 1, panX = 0, panY = 0;
let suppressClick = false;
const sceneWrapEl = document.getElementById("sceneWrap");
const sceneEl = document.getElementById("scene");
const stageEl = document.getElementById("stage");

// The stage is never itself transformed, so its rect is the artwork's true box.
// At zoom === 1 this clamp collapses to exactly 0,0 — the art is locked in frame.
function clampPan() {
  const r = stageEl.getBoundingClientRect();
  panX = Math.min(0, Math.max(r.width  - r.width  * zoom, panX));
  panY = Math.min(0, Math.max(r.height - r.height * zoom, panY));
}

function applyView(animate) {
  clampPan();
  sceneEl.classList.toggle("animating", !!animate);
  sceneEl.style.transform = "translate(" + panX + "px," + panY + "px) scale(" + zoom + ")";
  document.getElementById("zoomLevel").textContent = Math.round(zoom * 100) + "%";
  sceneWrapEl.classList.toggle("grabbable", zoom > 1);
  if (animate) setTimeout(() => sceneEl.classList.remove("animating"), 280);
}

// Zoom about a viewport point, so the pixel under the cursor stays put.
function zoomAt(next, clientX, clientY, animate) {
  next = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, next));
  if (next === zoom) return;
  const r = stageEl.getBoundingClientRect();
  const px = clientX - r.left, py = clientY - r.top;
  const k = next / zoom;
  panX = px - (px - panX) * k;
  panY = py - (py - panY) * k;
  zoom = next;
  applyView(animate);
}

sceneWrapEl.addEventListener("wheel", (e) => {
  e.preventDefault();
  zoomAt(zoom * Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY, false);
}, { passive: false });

let dragging = false, dragX = 0, dragY = 0, panX0 = 0, panY0 = 0, dragDist = 0, captured = false;
sceneWrapEl.addEventListener("pointerdown", (e) => {
  suppressClick = false;
  if (zoom <= 1 || e.button !== 0) return;
  dragging = true; dragDist = 0; captured = false;
  dragX = e.clientX; dragY = e.clientY;
  panX0 = panX; panY0 = panY;
  sceneWrapEl.classList.add("grabbing");
  // NB: pointer capture is deliberately NOT taken here. Capturing retargets the
  // following click to the capture element, and the scene click handler lives on
  // the canvas — which is why clicking a hippo used to work only at zoom 1.
  // We capture lazily below, once the gesture is genuinely a drag.
});
sceneWrapEl.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const dx = e.clientX - dragX, dy = e.clientY - dragY;
  dragDist = Math.max(dragDist, Math.hypot(dx, dy));
  if (!captured && dragDist > 4) {
    captured = true;
    try { sceneWrapEl.setPointerCapture(e.pointerId); } catch (_) {}
  }
  panX = panX0 + dx; panY = panY0 + dy;
  applyView(false);
});
function endDrag(e) {
  if (!dragging) return;
  dragging = false;
  if (dragDist > 4) suppressClick = true;
  sceneWrapEl.classList.remove("grabbing");
  if (captured) { try { sceneWrapEl.releasePointerCapture(e.pointerId); } catch (_) {} }
  captured = false;
}
sceneWrapEl.addEventListener("pointerup", endDrag);
sceneWrapEl.addEventListener("pointercancel", endDrag);

function zoomFromCentre(delta) {
  const r = stageEl.getBoundingClientRect();
  zoomAt(zoom + delta, r.left + r.width / 2, r.top + r.height / 2, true);
}
document.getElementById("zoomIn").addEventListener("click", () => zoomFromCentre(+0.5));
document.getElementById("zoomOut").addEventListener("click", () => zoomFromCentre(-0.5));
document.getElementById("zoomFit").addEventListener("click", () => {
  zoom = 1; panX = 0; panY = 0; applyView(true);
});
</script>
